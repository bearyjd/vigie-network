    "/identity/candidates/{candidate_id}/clear-veto": {
      "post": {
        "description": "Authenticated human action, audited with X-Request-ID. Supply the current device identity_override_version values from device detail in expected_versions (or expected_version for one device). Stale versions return 409. Body and per-token rate limits apply. Attach-relevant identity changes delay in-flight rule attachments; unrelated label/token/audit writes and no-op retries do not. Record an overrides-side clear_veto decision for the exact candidate pair. For historical merged endpoints, expected_versions covers both exact endpoints and their current canonical devices, deduplicated. Read each device detail's identity_override_version. Retired historical aliases are allowed only when their canonical devices are live. All involved versions advance together. The API keeps inventory.db read-only. The pipeline consumes this once on its next pass, dismisses the veto, and recomputes/revalidates evidence. Clearing alone never attaches; current overlap still blocks attachment.",
        "operationId": "clear_candidate_identity_candidates__candidate_id__clear_veto_post",
        "parameters": [
          {
            "in": "path",
            "name": "candidate_id",
            "required": true,
            "schema": {
              "maxLength": 64,
              "minLength": 1,
              "title": "Candidate Id",
              "type": "string"
            }
          },
          {
            "in": "header",
            "name": "x-request-id",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "maxLength": 128,
                  "minLength": 1,
                  "pattern": "^[A-Za-z0-9_.:-]+$",
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "X-Request-Id"
            }
          },
          {
            "in": "header",
            "name": "authorization",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Authorization"
            }
          }
        ],
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/VersionedWrite"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/WriteResultResponse"
                }
              }
            },
            "description": "Successful Response"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Unauthorized (uniform for every authentication failure)"
          },
          "403": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Token lacks the required write privilege"
          },

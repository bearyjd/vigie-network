  "info": {
    "summary": "App-principal API for the Vigie network device inventory.",
    "title": "Vigie API",
    "version": "0.1.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/devices": {
      "get": {
        "description": "Aliases (devices merged into another) are hidden unless `include_aliases=1`, and an alias shows its canonical device's override. Retired and transient devices are hidden unless `include_retired=1` / `include_transient=1` (or `status=` is given).",
        "operationId": "list_devices_devices_get",
        "parameters": [
          {
            "in": "query",
            "name": "type",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "enum": [
                    "phone",
                    "tv",
                    "iot",
                    "camera",
                    "laptop",
                    "console",
                    "unknown"
                  ],
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Type"
            }
          },
          {
            "in": "query",
            "name": "group",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "maxLength": 32,
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Group"
            }
          },
          {
            "in": "query",
            "name": "identity_state",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "enum": [
                    "ok",
                    "conflict",
                    "pending_confirm"
                  ],
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Identity State"
            }
          },
          {
            "in": "query",
            "name": "status",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "enum": [
                    "active",
                    "transient",
                    "retired"
                  ],
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Status"
            }
          },
          {
            "description": "ISO-8601 UTC, e.g. 2026-01-01T00:00:00Z",
            "in": "query",
            "name": "updated_since",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "maxLength": 64,
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "description": "ISO-8601 UTC, e.g. 2026-01-01T00:00:00Z",
              "title": "Updated Since"
            }
          },
          {
            "in": "query",
            "name": "include_transient",
            "required": false,
            "schema": {
              "default": false,
              "title": "Include Transient",
              "type": "boolean"
            }
          },
          {
            "in": "query",
            "name": "include_retired",
            "required": false,
            "schema": {
              "default": false,
              "title": "Include Retired",
              "type": "boolean"
            }
          },
          {
            "in": "query",
            "name": "include_aliases",
            "required": false,
            "schema": {
              "default": false,
              "title": "Include Aliases",
              "type": "boolean"
            }
          },
          {
            "in": "query",
            "name": "cursor",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "maxLength": 256,
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Cursor"
            }
          },
          {
            "in": "query",
            "name": "limit",
            "required": false,
            "schema": {
              "default": 100,
              "maximum": 500,
              "minimum": 1,
              "title": "Limit",
              "type": "integer"
            }
          },
          {
            "in": "header",
            "name": "authorization",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "title": "Authorization"
            }
          }
        ],
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DevicesResponse"
                }
              }
            },
            "description": "Successful Response"
          },
          "400": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Malformed cursor, If-Match or updated_since"
          },
          "401": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Unauthorized (uniform for every authentication failure)"
          },
          "422": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Validation error"
          },
          "429": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "Rate limited; see Retry-After"
          },
          "503": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            },
            "description": "inventory_unavailable: inventory.db does not exist yet"
          }
        },
        "security": [
          {
            "bearer": []
          }
        ],
        "summary": "List devices (effective view)",
        "tags": [
          "devices"
        ]
      }
    },

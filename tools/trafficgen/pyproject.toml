[project]
name = "vigie-trafficgen"
version = "0.1.0"
description = "Deterministic synthetic collector traffic for Vigie tests (archetypes + adversarial profiles)"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "vigie-ingest",
  "jsonschema>=4.21",
  "httpx>=0.27",
]

[project.scripts]
trafficgen = "trafficgen.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.uv.sources]
vigie-ingest = { path = "../../server", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trafficgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=trafficgen --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603", "S607"]
# Synthetic data generation: a seeded, non-cryptographic PRNG is the point.
"src/trafficgen/*" = ["S311"]

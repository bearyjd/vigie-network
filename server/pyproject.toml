[project]
name = "vigie-ingest"
version = "0.1.0"
description = "Vigie collector ingest service (collector principal only)"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[project.scripts]
vigie-pipeline = "vigie_pipeline.cli:main"
vigie-api = "vigie_api.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie_ingest", "src/vigie_pipeline", "src/vigie_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 20
addopts = "--cov=vigie_ingest --cov=vigie_pipeline --cov=vigie_api --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"tests/ro_wal_harness.py" = ["S603", "S101"]  # runs bubblewrap and our own interpreter
"tests/api/*" = ["S101", "S105", "S106", "F811"]
"tests/pipeline/*" = ["S101", "S105", "S106", "F811"]  # the `data` fixture is imported

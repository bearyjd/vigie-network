[project]
name = "vigie-ingest"
version = "0.1.0"
description = "Vigie collector ingest service (collector principal only)"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=vigie_ingest --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

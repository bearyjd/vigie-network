# Vigie server stack for rootless podman-compose. Run from deploy/ with a filled-in .env:
#   cp .env.example .env && $EDITOR .env
#   podman-compose up -d
#
# Three processes, one image, three volumes (PRP section 5 ownership table):
#
#   volume          ingest   pipeline   api
#   vigie-raw       rw       ro         -        raw shards (raw-YYYYMMDD.db) + ingest flock
#   vigie-inv       rw       rw         ro       inventory.db
#   vigie-overrides -        ro         rw       overrides.db (labels, links, tokens, audit log)
#
# docs/deploy.md has the same table and the exact writable paths; deploy/tests/check_refs.py fails
# when the two disagree. Ingest never mounts vigie-overrides, and api/pipeline address overrides.db
# DIRECTLY through VIGIE_OVERRIDES_PATH=/overrides/overrides.db (no symlink in a volume ingest can
# write); their entrypoint refuses to start when any overrides.db exists in a directory ingest
# can write.
#
# The consumer `:ro` mounts rely on KEEPERS: a SQLite WAL database that nobody has open loses its
# -wal/-shm files, and a reader on a read-only mount cannot recreate them (it fails closed with
# "unable to open database file"). So each writer keeps one connection open for its lifetime:
# ingest holds inventory.db and every raw shard, the pipeline loop holds inventory.db, the api holds
# overrides.db. Proven with a real read-only bind mount in server/tests/test_ro_mount_wal.py. If a
# keeper process is down its readers fail closed (pipeline: "no links, no rules" and a logged
# error; api: 500 on inventory reads).
#
# NOT verified by a real build/run in this repo's review (no container runtime was available):
# only static checks (yaml parse, `podman-compose config` against a stub podman, shellcheck, hand
# review), plus the bubblewrap read-only-mount tests above.
#
# All three containers run as the same numeric user (10001, set explicitly below) because files
# are created 0600 and podman rootless maps volumes to one owner; separation is by mount + code,
# not by uid.

x-hardening: &hardening
  read_only: true
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
  # unless-stopped (not on-failure) so that podman-restart.service brings the stack back after a
  # reboot; see docs/deploy.md "Reboots".
  restart: unless-stopped
  pids_limit: 256
  mem_limit: 512m
  cpus: 1.0

x-image: &image
  image: localhost/vigie-server:${VIGIE_IMAGE_TAG:-dev}
  build:
    # Repository root, so the image can copy both server/ and deploy/.
    context: ..
    dockerfile: deploy/Containerfile

x-common-env: &common-env
  # VIGIE_DATA_DIR is the RAW directory (shards + the ingest flock). The api does not mount it.
  VIGIE_DATA_DIR: /raw
  VIGIE_INVENTORY_PATH: /inv/inventory.db

x-secret-opts: &secret-opts
  uid: "10001"
  gid: "10001"
  mode: "0400"

services:
  ingest:
    <<: [*hardening, *image]
    command:
      - python
      - -m
      - vigie_ingest
      - --host
      - 0.0.0.0
      - --port
      - "8443"
      - --tls-cert
      - /run/secrets/vigie_tls_cert
      - --tls-key
      - /run/secrets/vigie_tls_key
      - --workers
      - "1"
    environment:
      <<: *common-env
      VIGIE_SECRETS_DIR: /run/secrets
      VIGIE_SHARD_RETENTION_DAYS: ${VIGIE_SHARD_RETENTION_DAYS:-7}
      VIGIE_MAX_SPOOL_AGE_S: ${VIGIE_MAX_SPOOL_AGE_S:-86400}
      VIGIE_RATE_LIMIT_PER_MIN: ${VIGIE_RATE_LIMIT_PER_MIN:-60}
      VIGIE_RATE_LIMIT_PREAUTH_PER_MIN: ${VIGIE_RATE_LIMIT_PREAUTH_PER_MIN:-120}
      VIGIE_RATE_LIMIT_IPV6_PREFIX: ${VIGIE_RATE_LIMIT_IPV6_PREFIX:-64}
      VIGIE_MAX_SHARD_DAYS: ${VIGIE_MAX_SHARD_DAYS:-3}
      VIGIE_BODY_TIMEOUT_S: ${VIGIE_BODY_TIMEOUT_S:-10}
    volumes:
      - vigie-raw:/raw:rw
      - vigie-inv:/inv:rw
    secrets:
      - source: vigie_tls_cert
        <<: *secret-opts
      - source: vigie_tls_key
        <<: *secret-opts
      # One entry per provisioned, non-revoked collector key (ingest refuses to start when a
      # provisioned collector has no valid key file). provision-collector.sh prints the lines.
      - source: collector_key_k1
        <<: *secret-opts
    ports:
      # No default for the address: an unset VIGIE_LAN_ADDR fails the config instead of
      # publishing on every interface.
      - "${VIGIE_LAN_ADDR:?set VIGIE_LAN_ADDR in .env to the LAN address to listen on}:${VIGIE_INGEST_PORT:-8443}:8443"
    healthcheck:
      # Ingest has no GET endpoint: a 4xx answer (405) over TLS means it is up; a 5xx never does.
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py", "http", "8443", "/v1/batch", "--accept-4xx"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  pipeline:
    <<: [*hardening, *image]
    command: ["python", "-m", "vigie_pipeline", "run", "--loop", "${VIGIE_PIPELINE_INTERVAL_S:-30}"]
    # Exits non-zero (SchemaVersionError) until ingest's schema exists: provision a collector
    # first (quick start) or run once with --migrate. The restart policy retries until then.
    environment:
      <<: *common-env
      VIGIE_OVERRIDES_PATH: /overrides/overrides.db
      VIGIE_GUARD_OVERRIDES: "1"
      VIGIE_PIPELINE_INTERVAL_S: ${VIGIE_PIPELINE_INTERVAL_S:-30}
      VIGIE_HEALTH_FILE: /tmp/vigie-pipeline.ok
      VIGIE_TRANSIENT_WINDOW_S: ${VIGIE_TRANSIENT_WINDOW_S:-86400}
      VIGIE_TRANSIENT_MIN_DWELL_S: ${VIGIE_TRANSIENT_MIN_DWELL_S:-7200}
      VIGIE_PROMOTION_CAP_PER_HOUR: ${VIGIE_PROMOTION_CAP_PER_HOUR:-20}
    volumes:
      - vigie-raw:/raw:ro
      - vigie-inv:/inv:rw
      - vigie-overrides:/overrides:ro
    healthcheck:
      # Heartbeat: the loop touches the file after every SUCCESSFUL pass; unhealthy once the last
      # one is older than 3 x VIGIE_PIPELINE_INTERVAL_S (a failing or wedged loop goes unhealthy).
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py", "fresh", "/tmp/vigie-pipeline.ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  api:
    <<: [*hardening, *image]
    command:
      - python
      - -m
      - vigie_api
      - --host
      - 0.0.0.0
      - --port
      - "8444"
      - --tls-cert
      - /run/secrets/vigie_api_tls_cert
      - --tls-key
      - /run/secrets/vigie_api_tls_key
    environment:
      # No VIGIE_DATA_DIR: the api has no raw shards and mounts no data directory.
      VIGIE_INVENTORY_PATH: /inv/inventory.db
      VIGIE_OVERRIDES_PATH: /overrides/overrides.db
      VIGIE_GUARD_OVERRIDES: "1"
      VIGIE_API_RATE_LIMIT: ${VIGIE_API_RATE_LIMIT:-120}
      VIGIE_API_RATE_WINDOW_S: ${VIGIE_API_RATE_WINDOW_S:-60}
      VIGIE_API_MAX_BODY_BYTES: ${VIGIE_API_MAX_BODY_BYTES:-16384}
    volumes:
      - vigie-inv:/inv:ro
      - vigie-overrides:/overrides:rw
    secrets:
      # The api's OWN certificate and key; ingest's compromise must not yield the api's key.
      - source: vigie_api_tls_cert
        <<: *secret-opts
      - source: vigie_api_tls_key
        <<: *secret-opts
    ports:
      - "${VIGIE_LAN_ADDR:?set VIGIE_LAN_ADDR in .env to the LAN address to listen on}:${VIGIE_API_PORT:-8444}:8444"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py", "http", "8444", "/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  vigie-raw: {}
  vigie-inv: {}
  vigie-overrides: {}

# External podman secrets, created with `podman secret create` (gen-certs.sh and
# provision-collector.sh do it). External, not `file:`, because podman-compose only honours
# uid/gid/mode for external secrets; a `file:` secret is a bind mount owned by the host user,
# which the unprivileged container user could not read.
secrets:
  vigie_tls_cert:
    external: true
  vigie_tls_key:
    external: true
  vigie_api_tls_cert:
    external: true
  vigie_api_tls_key:
    external: true
  collector_key_k1:
    external: true

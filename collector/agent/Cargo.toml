[package]
name = "vigie-collector"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vigie_agent"
path = "src/lib.rs"

[[bin]]
name = "vigie-collector"
path = "src/main.rs"

[dependencies]
vigie-parse = { path = "../parse" }
net-spike = { path = "../net-spike" }
hmac = "0.13"
sha2 = "0.11"
# TLS 1.2/1.3 with the ring provider only (no aws-lc, no default features, no logging).
# Parses the server certificate (SPKI for the pin). Same version rustls already uses; `alloc` is
# needed for `subject_public_key_info()`.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
serde_json = "1"
vigie-conntrack = { path = "../conntrack-helper" }
socket2 = { version = "0.6", features = ["all"] }
vigie-parse = { path = "../parse" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

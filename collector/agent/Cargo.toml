[package]
name = "vigie-collector"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "vigie_agent"
path = "src/lib.rs"

[[bin]]
name = "vigie-collector"
path = "src/main.rs"

[dependencies]
vigie-parse = { path = "../parse" }
hmac = "0.12"
sha2 = "0.10"
# TLS 1.2/1.3 with the ring provider only (no aws-lc, no default features, no logging).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
serde_json = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

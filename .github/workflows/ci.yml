name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      # Docs-only scope (docs/**, README.md, .trail/learnings/**). The owner may add the repo
      # secret VIGIE_LINT_FORBIDDEN_WORDS (comma-separated private words); unset is a no-op.
      - name: Docs private-info lint (and its tests)
        env:
          VIGIE_LINT_FORBIDDEN_WORDS: ${{ secrets.VIGIE_LINT_FORBIDDEN_WORDS }}
        run: |
          python -I tools/docs_private_info_lint.py
          uvx --from pytest==8.4.2 pytest -q -p no:cacheprovider tools/tests
      - name: Install host Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Run the full local gate
        env:
          VIGIE_CI_LOG_DIR: ${{ runner.temp }}/vigie-ci-logs
          VIGIE_E2E_BASE: ${{ runner.temp }}/vigie-e2e
          VIGIE_E2E_TMP: ${{ runner.temp }}/vigie-e2e-tmp
        run: scripts/ci.sh
      - name: Upload gate and whole-chain logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: |
            ${{ runner.temp }}/vigie-ci-logs
            ${{ runner.temp }}/vigie-e2e/run-*/logs
